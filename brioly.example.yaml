# brioly.yaml — copy to brioly.yaml and adjust.
#
# This file holds references to secrets only (${VAR}). Values are read from,
# in order: your environment, a .env file next to this file, and
# ~/.brioly/credentials (KEY=VALUE lines, chmod 600).
version: 1

# Where documents are written.
output: brioly-docs

# Bring your own key. Only collected facts are sent to the model, never
# source code or environment variable values. Use --no-llm to skip this.
llm:
  api_key: ${ANTHROPIC_API_KEY}
  model: claude-opus-5-5

docs:
  language: English          # e.g. Korean, Japanese, German
  jd_roles: []               # e.g. ["Backend Engineer", "Cloud Engineer"]; empty = suggest

# Optional: send what is collected to a brioly Cloud workspace with
# `brioly sync`. Create the token in the workspace (Sources, brioly CLI) and
# keep it out of this file: set BRIOLY_TOKEN in your environment or in
# ~/.brioly/credentials. Only facts are sent, after masking; never source
# code or environment variable values.
# cloud:
#   token: ${BRIOLY_TOKEN}

# Names, owners, merges and notes for the components brioly finds. Optional.
# Create a starter file with: brioly components init
components: components.yaml

# Tags that count as structural. Changes to other tags never raise a change
# event. This is the default list.
labels:
  allow: [env, environment, team, owner, service, app, project]

sources:
  # AWS uses the standard credential chain (profile, SSO, environment, OIDC).
  # Use a read-only profile; brioly only calls Describe/List APIs.
  aws:
    profile: prod-readonly
    regions: [ap-northeast-2]

  # Optional: read what runs inside Kubernetes clusters (workloads, Services,
  # Ingresses) from their API servers. Never Secrets, ConfigMaps or pods.
  # The identity needs read access in the cluster, see
  # docs/examples/kubernetes-readonly.yaml. Without this, what runs in a
  # cluster is known only from manifests in the repositories below.
  #
  # Any cluster kubectl can reach (EKS, GKE, AKS, self-managed): run brioly
  # with KUBECONFIG set, and the current context of that file is read with
  # the credentials it names:
  #
  #   KUBECONFIG=~/.kube/config brioly generate
  #
  # Or configure it here. ~/.kube/config is never used on its own.
  # kubernetes:
  #   kubeconfig: ./kubeconfig         # instead of the KUBECONFIG variable
  #   contexts: [prod, staging]        # default: the current context
  #   eks: true                        # also every EKS cluster the AWS scan finds, with the AWS identity (no kubeconfig needed)
  #   exclude_namespaces: [kube-system, kube-public, kube-node-lease]

  # Local checkouts. Set name to override the repository name.
  repos:
    - path: ../api
    - path: ../web
